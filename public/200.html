    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/')))) {
              const dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.OPEN = 1;
              dummy.CLOSED = 3;
              dummy.send = function() {};
              dummy.close = function() {};
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event?.reason?.message || '';
          const stack = event?.reason?.stack || '';
          if (
            msg.includes('WebSocket') ||
            stack.includes('createWebSocketModuleRunnerTransport') ||
            stack.includes('@vite/client')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
